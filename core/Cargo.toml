# SPDX-License-Identifier: MPL-2.0
[package]
license = "MPL-2.0"
name = "nbt-installer-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The installer's SSH, gateway search, activation relay and embedded release, shared by the Windows installer and the phone app."

[lib]
name = "nbt_installer_core"

[dependencies]
# link-local: without it the crate drops 169.254 addresses on Windows,
# the ENET cable's own.
if-addrs = { version = "0.15", features = ["link-local"] }
rand = "0.10"
futures-util = "0.3"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa", "dsa"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[build-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
